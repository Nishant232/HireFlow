  <line x1="430" y1="152" x2="320" y2="180" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#w-blue)"/>
  <line x1="530" y1="152" x2="640" y2="180" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#w-blue)"/>

