<svg width="960" height="680" viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="960" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#FDF4FF"/>
    </linearGradient>
    <filter id="wf-drop" x="-4%" y="-4%" width="108%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(15,23,42,0.08)"/>
    </filter>
    <marker id="w-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="w-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="w-violet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <marker id="w-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10B981"/>
