  <line x1="310" y1="607" x2="455" y2="638" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="520" y1="607" x2="500" y2="638" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="715" y1="607" x2="540" y2="638" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="863" y1="607" x2="560" y2="638" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>

