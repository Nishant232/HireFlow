  <text x="480" y="136" text-anchor="middle" font-size="11" fill="#94A3B8">Visitor discovers HireFlow</text>

  <!-- Arrow down from Landing -->
  <line x1="480" y1="152" x2="480" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#w-gray)"/>

