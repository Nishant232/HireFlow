  <line x1="863" y1="499" x2="863" y2="516" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#w-gray)"/>
  <g filter="url(#wf-drop)">
    <rect x="796" y="517" width="134" height="36" rx="8" fill="white" stroke="#FDE68A"/>
  </g>
