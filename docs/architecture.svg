  <text x="135" y="431" text-anchor="middle" font-size="10" fill="#D1FAE5">Authentication</text>
  <text x="135" y="451" text-anchor="middle" font-size="11" fill="#065F46">User Auth &amp; JWT Sessions</text>
  <text x="135" y="468" text-anchor="middle" font-size="11" fill="#065F46">Email Verification</text>
  <text x="135" y="485" text-anchor="middle" font-size="11" fill="#065F46">Row-Level Security</text>
  <text x="135" y="502" text-anchor="middle" font-size="10" fill="#6EE7B7">supabase/supabase-js v2</text>

