  <text x="636" y="244" text-anchor="middle" font-size="12" fill="#5B21B6">Zod Validation</text>
  <rect x="732" y="224" width="172" height="30" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
