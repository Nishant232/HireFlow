  <rect x="550" y="148" width="172" height="30" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="636" y="168" text-anchor="middle" font-size="12" fill="#5B21B6">Express.js 4</text>
  <rect x="732" y="148" width="172" height="30" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="818" y="168" text-anchor="middle" font-size="12" fill="#5B21B6">TypeScript 5</text>

  <rect x="550" y="186" width="172" height="30" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
