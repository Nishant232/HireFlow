  <line x1="340" y1="545" x2="367" y2="545" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a-blue)" opacity="0.7"/>
  <text x="374" y="549" font-size="10.5" fill="#475569">FE → Supabase direct auth</text>
