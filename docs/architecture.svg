  <text x="480" y="218" text-anchor="middle" font-size="10" fill="#64748B">HTTPS REST</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- CONNECTOR: Backend → Services             -->
  <!-- ══════════════════════════════════════════ -->
  <!-- Vertical drop from backend bottom center -->
  <line x1="732" y1="330" x2="732" y2="365" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3"/>
