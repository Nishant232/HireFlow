  <text x="228" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="white">⚡  Frontend Layer</text>
  <text x="228" y="131" text-anchor="middle" font-size="11" fill="#BFDBFE">React SPA running in the browser</text>

  <!-- FE chip rows -->
  <!-- Row 1 -->
  <rect x="46" y="148" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="132" y="168" text-anchor="middle" font-size="12" fill="#1D4ED8">⚛  React 18 + Vite 5</text>
  <rect x="228" y="148" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="314" y="168" text-anchor="middle" font-size="12" fill="#1D4ED8">TypeScript 5</text>
  <!-- Row 2 -->
  <rect x="46" y="186" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="132" y="206" text-anchor="middle" font-size="12" fill="#1D4ED8">Tailwind CSS 3</text>
  <rect x="228" y="186" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="314" y="206" text-anchor="middle" font-size="12" fill="#1D4ED8">Zustand State</text>
  <!-- Row 3 -->
  <rect x="46" y="224" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="132" y="244" text-anchor="middle" font-size="12" fill="#1D4ED8">Radix UI Primitives</text>
  <rect x="228" y="224" width="172" height="30" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="314" y="244" text-anchor="middle" font-size="12" fill="#1D4ED8">React Router 6</text>
  <!-- Row 4 - full width -->
