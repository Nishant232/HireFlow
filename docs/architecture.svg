  <text x="359" y="431" text-anchor="middle" font-size="10" fill="#DCFCE7">Database</text>
  <text x="359" y="451" text-anchor="middle" font-size="11" fill="#14532D">Application Records</text>
  <text x="359" y="468" text-anchor="middle" font-size="11" fill="#14532D">Resume Data &amp; AI Insights</text>
  <text x="359" y="485" text-anchor="middle" font-size="11" fill="#14532D">User Analytics Store</text>
  <text x="359" y="502" text-anchor="middle" font-size="10" fill="#86EFAC">Mongoose ODM v8</text>

  <!-- OpenRouter  x=476 w=230 -->
  <g filter="url(#card-drop)">
    <rect x="476" y="395" width="230" height="125" rx="12" fill="white" stroke="#FBCFE8" stroke-width="1.5"/>
    <rect x="476" y="395" width="230" height="36" rx="12" fill="#DB2777"/>
    <rect x="476" y="413" width="230" height="18" fill="#DB2777"/>
  </g>
  <text x="591" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">OpenRouter AI</text>
  <text x="591" y="431" text-anchor="middle" font-size="10" fill="#FCE7F3">LLM Integration</text>
  <text x="591" y="451" text-anchor="middle" font-size="11" fill="#9D174D">Resume Tailor (JD matching)</text>
  <text x="591" y="468" text-anchor="middle" font-size="11" fill="#9D174D">Cover Letter Generation</text>
  <text x="591" y="485" text-anchor="middle" font-size="11" fill="#9D174D">Interview Prep Q&amp;A</text>
  <text x="591" y="502" text-anchor="middle" font-size="10" fill="#F9A8D4">GPT-4o · LLaMA 3.1 · Nemotron</text>

  <!-- Adzuna  x=716 w=216 -->
  <g filter="url(#card-drop)">
    <rect x="716" y="395" width="216" height="125" rx="12" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="716" y="395" width="216" height="36" rx="12" fill="#EA580C"/>
    <rect x="716" y="413" width="216" height="18" fill="#EA580C"/>
  </g>
  <text x="824" y="416" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">Adzuna Jobs API</text>
  <text x="824" y="431" text-anchor="middle" font-size="10" fill="#FFEDD5">Job Listings</text>
  <text x="824" y="451" text-anchor="middle" font-size="11" fill="#7C2D12">Live Job Postings</text>
  <text x="824" y="468" text-anchor="middle" font-size="11" fill="#7C2D12">AI Match Score</text>
  <text x="824" y="485" text-anchor="middle" font-size="11" fill="#7C2D12">Location-based Search</text>
  <text x="824" y="502" text-anchor="middle" font-size="10" fill="#FDBA74">India &amp; Global Markets</text>

  <!-- ── Legend ── -->
  <line x1="28" y1="545" x2="55" y2="545" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#a-blue)"/>
