  <g filter="url(#card-drop)">
    <rect x="252" y="395" width="214" height="125" rx="12" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="252" y="395" width="214" height="36" rx="12" fill="#16A34A"/>
    <rect x="252" y="413" width="214" height="18" fill="#16A34A"/>
