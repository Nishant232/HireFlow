  <line x1="135" y1="365" x2="135" y2="393" stroke="#10B981" stroke-width="2" marker-end="url(#a-green)"/>
  <line x1="360" y1="365" x2="360" y2="393" stroke="#16A34A" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="592" y1="365" x2="592" y2="393" stroke="#EC4899" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="825" y1="365" x2="825" y2="393" stroke="#EA580C" stroke-width="2" marker-end="url(#a-gray)"/>

