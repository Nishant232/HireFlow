name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Stage built frontend and commit
        run: |
          git add -f frontend/dist/
          git diff --cached --quiet || git commit -m "ci: deploy $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"

      - name: Push to Hugging Face Space
        run: |
          git remote add hf https://Nishant00:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Nishant00/HireFlow
          git push hf HEAD:main --force
