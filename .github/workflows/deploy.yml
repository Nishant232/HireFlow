name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Stage built frontend and commit
        run: |
          git add -f frontend/dist/
          git diff --cached --quiet || git commit -m "ci: deploy $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://Nishant00:${HF_TOKEN}@huggingface.co" > ~/.git-credentials

          # Create a fresh orphan branch — no history, so no binary files from old commits
          git checkout --orphan hf-deploy

          # Remove screenshots (binary files HF rejects)
          git rm -rf --cached docs/screenshots/ 2>/dev/null || true

          # Write a minimal HF Space README (only the config frontmatter HF requires)
          printf -- '---\ntitle: HireFlow\ncolorFrom: blue\ncolorTo: purple\nsdk: docker\npinned: false\n---\n\nHireFlow — AI-powered job search platform.\n' > README.md
          git add README.md

          git commit -m "deploy: $(date -u +%Y%m%dT%H%M%SZ)"

          git remote add hf https://huggingface.co/spaces/Nishant00/HireFlow
          git push hf hf-deploy:main --force
